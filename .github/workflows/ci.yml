name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
      CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 }}
      
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          # Full history so a future `cs-coverage check` can reach the
          # pull request's merge base (see the deferred gate note below).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      
      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.1 fixed the wrapping
        # and Setext rewrites the estate relies on.
        uses: >-
          leynos/shared-actions/.github/actions/install-mdtablefix@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          version: '0.6.1'

      - name: Check formatting
        run: make check-fmt

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Check spelling
        run: make spelling

      # Dependency audits report advisories against the whole lockfile, so a
      # newly published advisory would fail every Dependabot PR regardless of
      # content and deadlock auto-merge. The scheduled audit workflow covers
      # Dependabot merges instead.
      - name: Audit dependencies
        if: github.actor != 'dependabot[bot]'
        run: make audit

      # Coverage runs on pull requests only. Pushes to main upload their
      # own coverage (and advance the ratchet baseline) via
      # coverage-main.yml, so generating it here as well would duplicate
      # the work and the CodeScene upload for the same commit.
      - name: Test and Measure Coverage
        if: ${{ github.event_name == 'pull_request' }}
        uses: leynos/shared-actions/.github/actions/generate-coverage@4d696e72fff6db49f34302ccf119ba978f1032c9
        # Pin the coverage venv's interpreter to the one setup-python installs.
        # The shared action creates `.venv-coverage` with a bare `uv venv`,
        # which takes whatever interpreter uv discovers first, and uv 0.12.19
        # began picking 3.14: pull requests then measured on 3.14 against a
        # baseline main measured on 3.13, and the ratchet failed on no change.
        # Keep in step with the other coverage lane; a contract holds the two.
        env:
          UV_PYTHON: '3.13'
        with:
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: df12-python-lints
          with-ratchet: 'true'
          
      # The changed-line `cs-coverage check` gate is deliberately not wired
      # in yet: CodeScene rejects `cs-coverage check` for any project whose
      # coverage-gates configuration is absent ("Lacks the gates
      # configuration."), which is a CodeScene-side, per-project setting
      # rather than a CI defect. Once this repo is onboarded to CodeScene
      # — set the `codescene_project_id` copier answer — and coverage-main.yml
      # has uploaded to main at least once, add a `mode: check` step guarded
      # on `CS_ACCESS_TOKEN != ''` with the project's
      # `project-url: https://api.codescene.io/v2/projects/<id>`.

  # The supported interpreters, with the real pinned nose binary installed
  # through the command's own explicit `install` operation.
  python-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install code
        run: uv sync --group dev --extra skylos --python ${{ matrix.python-version }}

      - name: Cache the pinned nose detector
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/nose
          key: nose-${{ runner.os }}-${{ hashFiles('tests/data/nose-pin/pyproject.toml') }}

      - name: Install the pinned nose detector
        run: >-
          uv run --python ${{ matrix.python-version }} df12-duplication install
          --repository tests/data/nose-pin --binary "$PWD/.tools/nose/nose"

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -n auto -p no:cacheprovider
