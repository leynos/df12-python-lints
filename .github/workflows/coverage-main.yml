name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push; pull requests generate
# coverage (and, in a future fast-follow, run the changed-line
# `cs-coverage check` gate) in ci.yml instead. This workflow also
# advances the coverage ratchet baseline: caches saved on main are
# readable by every pull-request run, so the baseline written here is the
# one PR ratchet checks compare against.
#
# `workflow_dispatch` is mandatory, not a convenience: merges performed by
# the automerge workflow's GITHUB_TOKEN do not fire push-event workflows,
# so automerged changes to main only receive coverage via a manual
# dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment contract holds it to
    # this job.
    environment: codescene
    permissions:
      contents: read
    env:
      CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 || '' }}
      
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@4d696e72fff6db49f34302ccf119ba978f1032c9
        # Pin the coverage venv's interpreter to the one setup-python installs.
        # The shared action creates `.venv-coverage` with a bare `uv venv`,
        # which takes whatever interpreter uv discovers first, and uv 0.12.19
        # began picking 3.14: pull requests then measured on 3.14 against a
        # baseline main measured on 3.13, and the ratchet failed on no change.
        # Keep in step with the other coverage lane; a contract holds the two.
        env:
          UV_PYTHON: '3.13'
        with:
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: df12-python-lints
          with-ratchet: 'true'
          

      # Publishes whether the token exists, and nothing else. The token is in
      # no `env` on this workflow: the upload is a composite action whose
      # nested steps inherit the calling step's `env`. GitHub evaluates the
      # expression before it sends the command to the runner, so this shell
      # receives only `true` or `false`; the upload alone receives the token,
      # as its input.
      - name: Check CodeScene token availability
        id: codescene_token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # The ref guard is not redundant with the push branch filter: a
      # dispatch runs from whichever branch started it, and the upload action
      # does not check the ref itself.
      - name: Upload coverage data to CodeScene
        if: steps.codescene_token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@4d696e72fff6db49f34302ccf119ba978f1032c9
        with:
          format: cobertura
          path: coverage.xml
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ env.CODESCENE_CLI_SHA256 }}
